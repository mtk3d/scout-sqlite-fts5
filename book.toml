[book]
title = "Laravel Scout SQLite FTS5 Driver"
description = "Laravel Scout driver for SQLite full-text search. Indexes your Eloquent models in SQLite FTS5 virtual tables with BM25 ranking and typo-tolerant matching, with no search service to run."
authors = ["Mateusz Cholewka"]
language = "en"
src = "docs"

[build]
build-dir = "book"

[output.html]
site-url = "/scout-sqlite-fts5/"
git-repository-url = "https://github.com/mtk3d/scout-sqlite-fts5"
edit-url-template = "https://github.com/mtk3d/scout-sqlite-fts5/edit/main/{path}"
preferred-dark-theme = "ayu"
no-section-label = true

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1
